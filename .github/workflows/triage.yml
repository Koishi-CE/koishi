# 自动分诊流水线
#
# 两个独立 job：
# - triage-issue 新 issue 自动分诊：assign 给仓库维护者并打
#   「状态:待确认」作为待处理队列的初始状态；类型 label（缺陷/功能）
#   由 issue 模板自带，此处兜底覆盖经 API/CLI 直建的 issue。
#   assignee 写死 Oppenheymu（repository_owner 是组织名，不能作
#   assignee）；引入第二维护者前没有按内容分派的空间。
# - label-pr 按 .github/labeler.yml 的路径规则自动打「范围」与
#   「文档」label，只增不减（sync-labels 关闭）。Dependabot PR 显式跳过：
#   由 Dependabot 触发的 workflow 按 fork 处理（secrets 不可用、
#   GITHUB_TOKEN 只读），此处声明的 pull-requests: write 会被降级，
#   actions/labeler 必然失败；Dependabot PR 的标签改由
#   .github/dependabot.yml 的 labels 字段直接指定。
# - PR 不做自动 assign：社区作者非协作者会导致 assign 失败，
#   收益近零不如不做。

name: Triage

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  triage-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 自动指派并标记待确认
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --add-assignee "Oppenheymu" \
            --add-label "状态:待确认"
        env:
          GH_TOKEN: ${{ github.token }}

  label-pr:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 按路径自动打标
        uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
