# CI 门禁流水线
#
# 三个并行 job：
# - gate   主门禁：bun run build → bun run check → bun test
#          （build 必须前置于 check：tsconfig.web.json 的部分 paths 指向各包
#            lib/index.d.ts 产物，全新环境无 lib 时 web 侧 tsc 直接 TS2307，
#            已实测；本地因 lib 常在而感知不到该顺序依赖）
# - client 前端构建：宿主控制台 + 全部 webui 插件（vite 编程式构建，无配置
#          文件）。前端构建是 .vue 的实际类型门禁（compiler-sfc 含
#          defineProps 类型解析），tsc 侧 .vue 只是不透明 Component。
# - knip   依赖与导出审计（bunx 直跑，不进 devDependencies；本地手动入口
#          bun run knip）。
#
# Bun 版本不在此处硬编码：oven-sh/setup-bun 自动读根 package.json 的
# packageManager（bun@1.4.0），升级只改根字段即可。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支 / PR 的旧跑自动取消，不占额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate (build / check / test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # CI 环境下 bun install 自动 frozen-lockfile；@parcel/watcher 的
      # postinstall 拦截提示属预期（平台预编译包就位即可用）
      - run: bun install
      - run: bun run build
      - run: bun run check
      - run: bun test

  client:
    name: client (webui bundle build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # 前端构建走 src 别名，理论上不依赖 lib；先 build 与本地已验证形态一致
      - run: bun run build
      - name: 宿主控制台前端
        run: bun packages/web/client/src/bin.ts build
      - name: 全部 webui 插件前端
        run: |
          for dir in plugins/webui/*/client; do
            bun packages/web/client/src/bin.ts build "$(dirname "$dir")"
          done

  knip:
    name: knip (deps & exports audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run knip
