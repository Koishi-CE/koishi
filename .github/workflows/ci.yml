# CI 门禁流水线
#
# 三个并行 job：
# - gate   主门禁：bun run build → 宿主前端构建 → bun run check → bun run test
#          （test 附带 lcov 覆盖率产出，随后经 codecov-action 上传，驱动
#            Codecov 在 PR 上的覆盖率评论与 status check；未配 CODECOV_TOKEN
#            secret 时公开仓自动降级 tokenless 上传，fork PR 出不了评论属预期）
#          （Dependabot PR 的 workflow 按 fork 处理：secrets 不可用、
#            GITHUB_TOKEN 只读，覆盖率上传同样降级；gate 内另有仅对
#            Dependabot PR 生效的锁文件格式守门 step，动机与上游缺陷见
#            .github/dependabot.yml 头部注释）
#          （build 必须前置于 check：tsconfig.web.json 的部分 paths 指向各包
#            lib/index.d.ts 产物，全新环境无 lib 时 web 侧 tsc 直接 TS2307，
#            已实测；本地因 lib 常在而感知不到该顺序依赖）
#          （test 必须走 bun run test 而非裸 bun test：前者经 package.json
#            脚本带上 --isolate，否则跨文件 mock.module 互相串扰；前端构建
#            前置于 test：console 的静态资源用例读 dist 真实产物）
# - client 前端构建：宿主控制台 + 全部 webui 插件（vite 编程式构建，无配置
#          文件）。前端构建是 .vue 的实际类型门禁（compiler-sfc 含
#          defineProps 类型解析），tsc 侧 .vue 只是不透明 Component。
# - fallow  死代码与依赖审计（bunx 直跑，不进 devDependencies；版本在根
#          package.json 的 fallow 脚本内 pin 精确版，避免门禁口径随上游
#          发布漂移；本地手动入口 bun run fallow）。豁免与规则见根目录
#          .fallowrc.jsonc：
#          循环依赖与 re-export 环为 error（全仓循环已于 2026-09 断环收官
#          清零，升为 error 防回归），反射式 API（unused-class-members /
#          component props）与 duplicate-exports 与 knip 时代口径一致地关闭。
#
# Bun 版本不在此处硬编码：oven-sh/setup-bun 自动读根 package.json 的
# packageManager（bun@1.4.2），升级只改根字段即可。

name: CI

# 触发面：merge_group 不可省。主分支 ruleset「保护主分支」（id 24072025）启用了
# merge queue，且 gate / client / fallow 是必需状态检查。GitHub 对必需检查只认
# 「在队列建的 gh-readonly-queue/<base>/pr-* 临时 ref 上跑出来的」那一次，
# pull_request 那次不算数：缺 merge_group 时队列永远等不到检查上报，超时（该
# ruleset 的 status check timeout，12 分钟）后把 PR 从队列里剔除，等于合并必然
# 失败。官方原文：「You must update your CI configuration to trigger and report on
# merge group events when requiring a merge queue.」
# 见 https://docs.github.com/zh/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/managing-a-merge-queue
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# 同一分支 / PR 的旧跑自动取消，不占额度。merge_group 的 ref 逐 entry 独立
# （gh-readonly-queue/... 带该 entry 的 sha），因此不会跨 entry 误取消；同一 ref
# 被重新请求检查时取消旧跑也无害——新跑约 2 分钟，远低于队列 12 分钟的超时。
# 故此处不对 merge_group 做例外（该例外是「ruleset workflow」的要求，非本形态）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate (build / check / test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # 锁文件格式守门（仅 Dependabot PR）：其 updater 镜像内的 Bun 版本
      # 不跟随仓库 packageManager，会把 lockfileVersion 2 的 bun.lock 静默
      # 降级重写（dependabot-core#15848 / #15897），使 PR diff 被整份锁文件
      # 重排淹没、真实依赖变更不可评审。常规 PR 零影响；Bun 升级使基线
      # 前移时同步调整下方阈值。
      - name: 锁文件格式守门（仅 Dependabot PR）
        if: github.actor == 'dependabot[bot]'
        run: |
          bun -e '
            const text = await Bun.file("bun.lock").text();
            const match = /"lockfileVersion":\s*(\d+)/.exec(text);
            const version = match ? Number(match[1]) : 0;
            console.log(`bun.lock lockfileVersion=${match ? version : "<未找到>"}`);
            if (version < 2) {
              console.log("::error::bun.lock 的 lockfileVersion 低于基线 2，疑似被 Dependabot 的旧版 Bun 降级重写；请用仓库钉定的 Bun（根 package.json 的 packageManager）重新执行 bun install 后提交。");
              process.exit(1);
            }
          '
      # CI 环境下 bun install 自动 frozen-lockfile；@parcel/watcher 的
      # postinstall 拦截提示属预期（平台预编译包就位即可用）
      - run: bun install
      - run: bun run build
      # console 插件的「静态资源托管」用例读真实 dist 产物（index.html /
      # logo.png），不构建前端则整套用例在干净环境下必失败；本地因 dist
      # 常在而感知不到，此处必须先出宿主控制台前端
      - name: 宿主控制台前端（console 静态资源测试的依赖）
        run: bun packages/web/builder/src/bin.ts build
      - run: bun run check
      - name: test（含 lcov 覆盖率产出）
        run: bun run test --coverage --coverage-reporter=text --coverage-reporter=lcov --coverage-dir=coverage
      - name: 上传覆盖率到 Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  client:
    name: client (webui bundle build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # 前端构建走 src 别名，理论上不依赖 lib；先 build 与本地已验证形态一致
      - run: bun run build
      - name: 宿主控制台前端
        run: bun packages/web/builder/src/bin.ts build
      - name: 全部 webui 插件前端
        run: |
          for dir in plugins/webui/*/client; do
            bun packages/web/builder/src/bin.ts build "$(dirname "$dir")"
          done

  fallow:
    name: fallow (dead code & deps audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run fallow
