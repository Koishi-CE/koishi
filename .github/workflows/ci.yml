# CI 门禁流水线
#
# 三个并行 job：
# - gate   主门禁：turbo 任务图——build 与宿主前端并行起步；check 四组
#          （静态两组不依赖构建、类型两组等构建）与 test 并行（test 也要 lib）
#          （test 附带 lcov 覆盖率产出，随后经 codecov-action 上传，驱动
#            Codecov 在 PR 上的覆盖率评论与 status check；未配 CODECOV_TOKEN
#            secret 时公开仓自动降级 tokenless 上传，fork PR 出不了评论属预期）
#          （Dependabot PR 的 workflow 按 fork 处理：secrets 不可用、
#            GITHUB_TOKEN 只读，覆盖率上传同样降级；gate 内另有仅对
#            Dependabot PR 生效的锁文件格式守门 step，动机与上游缺陷见
#            .github/dependabot.yml 头部注释）
#          （依赖关系写在根 turbo.jsonc 的 dependsOn 里，理由与旧版手写顺序
#            相同：build 前置于两组类型检查——tsconfig.web.json 的部分 paths
#            指向各包 lib/index.d.ts 产物，全新环境无 lib 时 web 侧 tsc 直接
#            TS2307（已实测）；build 前置于 test——测试文件自身加载各包 src，
#            但跨 workspace 的裸包名导入经 exports 落到 lib，无 lib 时 CI 上报
#            Cannot find module（run 37446712058 实证，5 个用例）；宿主控制台
#            前端前置于 test——console 的静态资源用例读 dist 真实产物；静态两组
#            不读 lib/dist，与构建同刻起跑。test 走 //#test:ci（= bun test
#            --isolate …，缺 --isolate 会让跨文件 mock.module 互相串扰），
#            它与 check 四组并行、仍等构建产物）
#          （turbo 的收益全在缓存：内容寻址 + 远程缓存让 merge_group 那一遍直接
#            复用 pull_request 那一遍的产物——两者内容逐字相同（实测最近 5 个
#            已合并 PR 的合并提交与 PR head tree 全等），命中即整轮跳过 build /
#            check / test，队列等待从 ~2 分钟降到 ~20 秒。未配 TURBO_TOKEN 时
#            自动降级为纯本地缓存，语义与不加 turbo 完全等价，只是快不了）
# - client 前端构建：turbo 跑 //#build + //#build:console + 16 个插件的
#          build:client（包级任务，vite 编程式构建、无配置文件，产物 dist/ 按包
#          缓存；并发压到 4 与 4 vCPU runner 匹配）。前端构建是 .vue 的实际类型
#          门禁（compiler-sfc 含 defineProps 类型解析），tsc 侧 .vue 只是不透明
#          Component。
# - fallow  死代码与依赖审计（turbo 任务 //#fallow；bunx 直跑，不进
#          devDependencies；版本在根 package.json 的 fallow 脚本内 pin 精确版，
#          避免门禁口径随上游发布漂移；本地手动入口 bun run fallow）。豁免与规则见
#          根目录 .fallowrc.jsonc：
#          循环依赖与 re-export 环为 error（全仓循环已于 2026-09 断环收官
#          清零，升为 error 防回归），反射式 API（unused-class-members /
#          component props）与 duplicate-exports 与 knip 时代口径一致地关闭。
#
# Bun 版本不在此处硬编码：oven-sh/setup-bun 自动读根 package.json 的
# packageManager（bun@1.4.2），升级只改根字段即可。

name: CI

# 触发面：merge_group 不可省。主分支 ruleset「保护主分支」（id 24072025）启用了
# merge queue，且 gate / client / fallow 是必需状态检查。GitHub 对必需检查只认
# 「在队列建的 gh-readonly-queue/<base>/pr-* 临时 ref 上跑出来的」那一次，
# pull_request 那次不算数：缺 merge_group 时队列永远等不到检查上报，超时（该
# ruleset 的 status check timeout，12 分钟）后把 PR 从队列里剔除，等于合并必然
# 失败。官方原文：「You must update your CI configuration to trigger and report on
# merge group events when requiring a merge queue.」
# 见 https://docs.github.com/zh/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/managing-a-merge-queue
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# 同一分支 / PR 的旧跑自动取消，不占额度。merge_group 的 ref 逐 entry 独立
# （gh-readonly-queue/... 带该 entry 的 sha），因此不会跨 entry 误取消；同一 ref
# 被重新请求检查时取消旧跑也无害——新跑约 2 分钟，远低于队列 12 分钟的超时。
# 故此处不对 merge_group 做例外（该例外是「ruleset workflow」的要求，非本形态）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate (build / check / test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: write 仅用于换取（短命的）Turborepo 远程缓存凭据：job 级声明，
    # 不扩散到不需要它的地方
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # 锁文件格式守门（仅 Dependabot PR）：其 updater 镜像内的 Bun 版本
      # 不跟随仓库 packageManager，会把 lockfileVersion 2 的 bun.lock 静默
      # 降级重写（dependabot-core#15848 / #15897），使 PR diff 被整份锁文件
      # 重排淹没、真实依赖变更不可评审。常规 PR 零影响；Bun 升级使基线
      # 前移时同步调整下方阈值。
      - name: 锁文件格式守门（仅 Dependabot PR）
        if: github.actor == 'dependabot[bot]'
        run: |
          bun -e '
            const text = await Bun.file("bun.lock").text();
            const match = /"lockfileVersion":\s*(\d+)/.exec(text);
            const version = match ? Number(match[1]) : 0;
            console.log(`bun.lock lockfileVersion=${match ? version : "<未找到>"}`);
            if (version < 2) {
              console.log("::error::bun.lock 的 lockfileVersion 低于基线 2，疑似被 Dependabot 的旧版 Bun 降级重写；请用仓库钉定的 Bun（根 package.json 的 packageManager）重新执行 bun install 后提交。");
              process.exit(1);
            }
          '
      # CI 环境下 bun install 自动 frozen-lockfile；@parcel/watcher 的
      # postinstall 拦截提示属预期（平台预编译包就位即可用）
      - run: bun install
      # 远程缓存凭据（OIDC）：把本次运行的 OIDC token 换成 Turborepo access token
      # （短命、仅够访问 Remote Cache、绑定团队），由 action 写入 TURBO_TOKEN /
      # TURBO_TEAM 供后续步骤使用。**换取失败不阻断门禁**（continue-on-error +
      # 下方告警）：必需检查不允许因第三方服务抖动变红；此时退化为纯本地缓存，
      # 语义与未接远程缓存完全一致，只是不快。
      - name: 换取 Turborepo 远程缓存凭据（OIDC）
        id: turbo-cache-token
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: 远程缓存未就绪告警（不阻断门禁）
        if: steps.turbo-cache-token.outcome != 'success'
        run: |
          echo "::warning::Turborepo 远程缓存凭据换取失败（OIDC policy / TURBO_TEAM 未就绪，或 Vercel 侧异常）。本次退回纯本地缓存：门禁语义不变，只是不快。"
      # 门禁经 turbo 执行：任务图、依赖与缓存口径见根 turbo.jsonc。命中远程
      # 缓存时全部任务整轮跳过（merge_group 那一遍复用 pull_request 那一遍
      # 即此情形）。check 四组必须在此显式列出——turbo 不支持 //#check:*
      # 通配（实测报 Could not find task），而它们之间无相互依赖、与 test 亦
      # 无依赖，由 turbo 并行调度：静态两组同刻起跑，test 与类型两组都等
      # //#build 的 lib 产物（跨包裸名导入经 exports 落到 lib，见 turbo.jsonc）。
      - name: 门禁（turbo：构建 → check 四组 ∥ test，含 lcov 覆盖率）
        run: bunx turbo run //#build //#build:console //#check:lint //#check:tooling //#check:types //#check:template //#test:ci
        env:
          TURBO_TELEMETRY_DISABLED: "1"
      - name: 上传覆盖率到 Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  client:
    name: client (webui bundle build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: 换取 Turborepo 远程缓存凭据（OIDC）
        id: turbo-cache-token
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: 远程缓存未就绪告警（不阻断门禁）
        if: steps.turbo-cache-token.outcome != 'success'
        run: |
          echo "::warning::Turborepo 远程缓存凭据换取失败（OIDC policy / TURBO_TEAM 未就绪，或 Vercel 侧异常）。本次退回纯本地缓存：门禁语义不变，只是不快。"
      # 前端构建走 src 别名，理论上不依赖 lib；先 build 与本地已验证形态一致。
      # 三者都经 turbo：命中缓存即跳过。插件前端是包级任务（16 个含 client/ 的
      # 插件各一条 build:client），turbo 并行调度、按包缓存 dist/——旧版这里是
      # 逐目录串行的 shell 循环，既不可缓存也不并行。并发压到 4，与 4 vCPU
      # runner 匹配（16 个 vite 构建同时起跑会互相拖慢）。
      - name: 根构建 + 宿主前端 + 全部 webui 插件前端（turbo）
        run: bunx turbo run //#build //#build:console build:client --concurrency=4
        env:
          TURBO_TELEMETRY_DISABLED: "1"

  fallow:
    name: fallow (dead code & deps audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: 换取 Turborepo 远程缓存凭据（OIDC）
        id: turbo-cache-token
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: 远程缓存未就绪告警（不阻断门禁）
        if: steps.turbo-cache-token.outcome != 'success'
        run: |
          echo "::warning::Turborepo 远程缓存凭据换取失败（OIDC policy / TURBO_TEAM 未就绪，或 Vercel 侧异常）。本次退回纯本地缓存：门禁语义不变，只是不快。"
      - name: 死代码与依赖审计（turbo）
        run: bunx turbo run //#fallow
        env:
          TURBO_TELEMETRY_DISABLED: "1"
