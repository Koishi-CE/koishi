# 发布流水线（npm OIDC 可信发布）
#
# 形态：三个串联 job，按「持有什么凭证」切分——只有 publish 持
# id-token: write 且挂 environment 审批。动机：npm 的可信发布把发布权授给
# 「谁能让本文件在 main 上跑起来」，因此**构建期可执行的代码绝不能与 OIDC
# token 同处一个 job**。package.json 的脚本、tsdown.config.ts、各插件
# build/client.ts 都是构建期执行的代码，一处被改坏就能拿着 token 发这 53 个
# 包的任意版本。
#
#   prepare  消费 changeset → 构建 → 测试 → 推送版本提交 → 打包 artifact
#            （contents: write，**无** id-token）
#   publish  解包 artifact → 逐包 npm publish
#            （id-token: write + environment 审批，**无** contents: write）
#   tag      发布成功后打两类 tag（contents: write，**无** id-token，
#            不 checkout 构建、不 install）：
#              · release/<日期>-<序号>  每批一个，轻量、无 Release
#              · milestone/<major>.<minor>  该兼容线首次出现时，annotated + draft Release
#
# tag 环为什么排在 publish 之后、且单独成 job：
# - 顺序：tag 是「这批已经上线」的记录；publish 失败或审批被拒时不该留下 tag。
# - 独立性：publish 已持 id-token，再给 contents: write 就等于同时握着「发任意
#   包版本」与「写仓库」两种能力；tag 环只需要后者，拆开才是最小权限。本 job
#   不 checkout、不 install、不构建，只用 gh api 与下载好的正文。
# - 为什么每批都打 release tag：本仓是 53 条独立版本线的 monorepo，没有整仓
#   版本号；批次 tag 只回答「npm 上这套版本对应哪棵树」。2026-09-14～10-25 有
#   27 个发布提交（单日最多 4 个），故名字必须带日期 + 当日序号；它不建
#   Release 对象（一年约 240 个，Release 页面会被刷屏）。
# - 为什么里程碑跟 core 的 minor：`@koishi-ce/core` 的 major.minor 恰是插件
#   peer（`^1.0.0`）的兼容边界，适合当「线」的标记；里程碑只在线的首个 tag
#   不存在时创建，频率是几条/年，正好放 GitHub Releases 页面。早期按 core
#   完整版本打的 v1.1.5 / v1.1.8 属历史遗留（不可变 Release），1.1 线由它们
#   代表，故不会再补 milestone/1.1——判定见 prepare。
# - 正文只建 draft：本仓 Release 发布后不可修改（immutable），自动产出的骨架
#   必须先经人按主题改写再发布。里程碑 tag 在建 draft 时已单独建好（draft 本身
#   不建 tag），因此 draft 拖着不发不影响 git 侧的标签记录。
# - 凭证用默认 GITHUB_TOKEN：仓库规则集只有 target=branch 的「保护主分支」，
#   tag 不受保护，GITHUB_TOKEN 足够；代价是它不触发 push 事件，GitLab 镜像的
#   `push: tags` 收不到，靠 mirror-gitlab.yml 每日 03:17 的兜底对账补上（最多
#   一天延迟）。
#
# 为什么 version 与 build 合成一个 job、不再跨 job 传 SHA：
# 早先的写法是 version job 输出提交 SHA，build job 用
# `actions/checkout` 的 `ref: ${{ needs.version.outputs.sha }}` 取那份代码。
# CodeQL 的 actions/cache-poisoning 查询会判定为「可被 workflow_dispatch 影响
# 的 ref 被特权 job 检出并执行」，在 .github/workflows/release.yml 上稳定报
# 3 条 high（Cache Poisoning via execution of untrusted code）。合成一个 job
# 后用默认 checkout（触发本次运行的提交），既消掉该污点，也免掉 SHA 传递这笔
# 额外状态：构建与测试跑的就是本 job 里刚提交的那棵树。
#
# 为什么推送排在构建与测试之后：推送是最后一步，构建或测试失败则 main 上不会
# 留下「版本已升、包却没发出去」的提交（早先是 version 环先推、再构建）。
#
# 为什么推送要用 GitHub App 的 installation token（而不是默认 GITHUB_TOKEN）：
# main 由 ruleset「保护主分支」保护（pull_request / merge_queue /
# required_signatures / code_coverage / code_scanning / non_fast_forward /
# deletion），而 **GITHUB_TOKEN 无法被加入该 ruleset 的 bypass 名单**（GitHub
# 的安全限制），于是 `git push origin HEAD:main` 必然被拒，报
# `GH013: Repository rule violations found for refs/heads/main`。App 的
# installation token 可以进 bypass 名单（模式须让规则对该 actor 不生效：
# `Always` 或 `exempt`，`Pull requests only` 则对直推无效）。官方 API 定义：
# `exempt` 时「规则不会为该 actor 运行，也不产生 bypass 审计条目」，故它是
# GitHub 对机器人的推荐模式（`Always` 会在审计日志里留下 bypass 事件）。
# 故推送改用 App 认证。最小暴露：App 只授 `Contents: Read and write`、只装在
# Koishi-CE/koishi，token 只在这一步取用（其余步骤仍是默认 GITHUB_TOKEN），
# publish 仍卡在 environment 审批。
#
# 代价必须写清：bypass 的语义是「**免于该 ruleset 的全部规则**」，不是「只免
# 签名」——这个 App 被滥用即可往 main 推任意内容（绕过 PR、merge queue、签名）。
# 另外 App token 落在**会执行构建期代码**的 prepare job 里（bun install / build /
# test 都在它前面跑），理论上可被污染的构建期代码窃取：`.git/hooks/pre-push`
# 就是现成通道，故推送用 `-c core.hooksPath=/dev/null` 显式禁用 hook；剩余面
# （改写 .git/config 的 url.*.insteadOf 之类）靠 CODEOWNERS 对构建文件的强制
# 复核兜底。仓库侧前置见文件末清单与 docs/process/release.md §7。
#
# 为什么 publish 不跑 bun install：`release publish` 只做 registry 比对、
# workspace:* 改写与逐包 npm publish，用不到 node_modules（工具链自身只用
# node: 内建模块）；而 install 是构建期代码执行的主要入口，不该出现在持
# token 的 job 里。补充：Bun 本身不执行依赖的 postinstall（`bun install --help`
# 原文 "dependency scripts are never run"，根 package.json 亦无
# trustedDependencies），这一层默认就是关的；此处仍按最小权限切分。
#
# npm 版本：OIDC 发布需 npm >= 11.5.1，runner 自带的 10.x 不支持可信发布，
# 故在 publish job 显式升级到 11（与本地开发口径 11.20.0 同一大版本）。注意
# runner 的 npm 装在 /usr/local（属 root），直接 `npm install -g` 会 EACCES，
# 因此装进用户级 prefix 再前置 PATH，动机与现场见该步骤的注释。
#
# 触发：只认「携带 changeset 的合并」，其余（补发 / 上次失败）走
# workflow_dispatch。
#
# 补发路径（`skip-version` 输入）：changeset 一旦被消费，重跑就再也走不到
# publish——version 环无条目可消费，`changed=false`，publish 被 if 跳过。
# 故 workflow_dispatch 提供 `skip-version`：置 true 时跳过 version 环，直接构建
# 当前 main 并交给 publish，由 `release publish` 的 registry 比对决定哪些版本
# 真的需要发（已发布的自动跳过）。它只影响「要不要消费 changeset」，不改变任何
# 审批：publish 依旧卡在 environment。
#
# 自激的边界（改用 App token 后新增的行为，别照抄旧结论）：GitHub 只对
# GITHUB_TOKEN 免触发——用它做的事所触发的事件不创建新的 workflow 运行，而
# App token 不在豁免之列。`release version --commit` 会 `git add .changeset`
# （被消费的 changeset 文件以删除形式入库），该提交因此命中本文件的
# `paths: ['.changeset/**']`。所以一次发布会多出一次运行：那次运行消费不到
# changeset，`changed=false`，只跑 install 与 version 即空转退出，不会再推送，
# 故不构成循环；`concurrency: group: release` 还保证两者串行。同一原因也会触发
# 一次 `ci.yml`（它的 `push: main` 没有 paths 过滤）——每次发布固定多出一轮完整
# CI，这是改由 App token 推送（而非 GITHUB_TOKEN）的固有代价。
#
# 前置（均为仓库设置，非代码）：
#   1. Settings → Environments 建 `release` 并勾 Required reviewers。名字必须
#      与 npm 信任配置的 environment claim 严格同名，否则 OIDC 不认；而 claim
#      不声明 environment 时，删掉本文件里的 environment: 即可绕过审批。
#   2. 该 Environment 的 Deployment branches 必须限制为 main：workflow_dispatch
#      是在「被 dispatch 的那个 ref」上取 workflow 文件的，不限制的话，有写权限
#      者可以在分支上改本文件后 dispatch，借 environment 拿到 OIDC。
#   3. 建一个 GitHub App（Repository permissions 只给 Contents: Read and write，
#      Webhook 关掉，仅安装到 Koishi-CE/koishi），把 Client ID 存成仓库
#      variable `APP_CLIENT_ID`（Client ID 非敏感，官方示例即用 variable）、
#      私钥存成 secret `APP_PRIVATE_KEY`，并把它加进主分支 ruleset 的 bypass
#      名单（模式 `Always` 或 `exempt`）。GITHUB_TOKEN 进不了该名单，这一步
#      没有替代品。
#   4. 开启 require_code_owner_review（CODEOWNERS 已覆盖 .github/workflows/**、
#      tooling/release/**、.changeset/**、package.json、bun.lock、tsdown.config.ts）。
#      这是本模型下唯一「零成本把危险改动变成需双人过目」的手段。

name: Release

on:
  push:
    branches: [main]
    paths: ['.changeset/**']
  workflow_dispatch:
    inputs:
      # 补发通道：changeset 已被消费 / 上次 publish 失败时，跳过 version 环直接发布
      skip-version:
        description: 跳过 changeset 消费，构建并发布当前 main 的版本（补齐「版本已升、包未发」的中间态）
        type: boolean
        default: false

# 严禁并发：两个运行同时消费 changeset 会撞版本号
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: prepare（消费 changeset → 构建 → 测试 → 推送）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # 提交版本变化 + 推送 main
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      # 版本提交 SHA：批次 tag 与里程碑 tag 都打在这个提交上（publish 可能等审批
      # 跨夜，届时 main 已前进，打 main 的当前 tip 会指到一棵没发布出去的树）
      commit: ${{ steps.bump.outputs.commit }}
      # 需要新建里程碑时的兼容线（`<major>.<minor>`）；为空表示该线已有里程碑或
      # 由历史 v<major>.<minor>.x tag 代表，本次不建
      milestone: ${{ steps.bump.outputs.milestone }}
    steps:
      # persist-credentials: false —— checkout 默认把 GITHUB_TOKEN 写进
      # .git/config 的 http.<url>.extraheader 并一直生效；推送已改用 App token，
      # 留着这份凭证会让请求头里的身份归属变得不确定。本 job 其余步骤都不需要
      # GITHUB_TOKEN 认证，关掉无副作用。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      # CI 环境下 bun install 自动 frozen-lockfile；@parcel/watcher 的
      # postinstall 拦截提示属预期（平台预编译包就位即可用）
      - run: bun install
      # commitVersionBumps 走 git commit；checkout 不带身份，不配必然失败。
      # 身份固定为 GitHub Actions 的官方 bot（而不是任何人的账号）：这些提交由
      # 流水线自动生成，GitHub 的贡献统计认 author/committer 邮箱，用维护者邮箱
      # 等于把机器提交记到其贡献主页上。署名与推送认证是两件事——推送仍走 App 的
      # installation token（见下方推送步骤），改署名不影响任何权限。
      - name: 配置 git 身份（GitHub Actions bot）
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - id: bump
        name: 消费 changeset（只提交，推送留到构建与测试通过之后）
        run: |
          # 本步产出三个输出：
          #   changed    本次运行是否要构建并发布
          #   commit     tag 环要打的提交（正常路径 = 版本提交；补发路径 = 当前 HEAD）
          #   milestone  需要新建里程碑时的兼容线（`<major>.<minor>`）；为空表示不建
          if [ "${{ inputs.skip-version }}" = "true" ]; then
            # 补发：changeset 已被消费，跳过 version 环但继续构建与发布。
            # HEAD 就是要发布的那棵树（artifact 由它构建），tag 也打在它上面
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "::notice::skip-version：跳过 changeset 消费，直接构建并发布当前提交"
          else
            before=$(git rev-parse HEAD)
            bun run release version --commit
            after=$(git rev-parse HEAD)
            if [ "$before" = "$after" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::无版本变化（条目可能全部命中 changesets ignore 列表），跳过构建与发布"
              exit 0
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit=$after" >> "$GITHUB_OUTPUT"
          fi
          # 批次 tag 每批都打（tag job 负责），这里只判断里程碑：core 的
          # major.minor 是插件 peer 的兼容边界，该线还没有标记时才建。
          # 两条「已有标记」的判据：
          #   1. milestone/<线> 已存在——本机制上线后打过的线；
          #   2. 历史遗留的 v<线>.x 存在——机制上线前按 core 完整版本打的
          #      v1.1.5 / v1.1.8，1.1 线由它们代表，不再补 milestone/1.1。
          # checkout 是 fetch-depth: 0，tag 都在本地，判据用 git 而非 API。
          core=$(node -p "require('./packages/node/core/package.json').version")
          line=$(echo "$core" | cut -d. -f1,2)
          if git rev-parse -q --verify "refs/tags/milestone/${line}" > /dev/null; then
            echo "::notice::里程碑 milestone/${line} 已存在，本次不建里程碑"
          elif [ -n "$(git tag -l "v${line}.*" | head -n1)" ]; then
            echo "::notice::里程碑 milestone/${line} 由历史 v${line}.x tag 代表，不补建"
          else
            echo "milestone=${line}" >> "$GITHUB_OUTPUT"
            echo "::notice::发布成功后将创建里程碑 milestone/${line} 并建 draft Release"
          fi
      - if: steps.bump.outputs.changed == 'true'
        run: bun run release build
      # 发布前测试：复用工具链自己的 test 环，避免在 YAML 里另写一份口径
      # （发布链曾漏掉 --isolate，与门禁口径不一致，就是这么漂移出来的）
      - if: steps.bump.outputs.changed == 'true'
        name: 发布前测试
        run: bun run release test
      # 取 App installation token（1 小时有效）。用 client-id 而不是 app-id：
      # v3 的 action.yml 给 app-id 标了 deprecationMessage「Use 'client-id'
      # instead.」，README 亦写明「legacy app-id is also accepted, but client-id
      # is recommended」。Client ID 不是秘密（它本就出现在 App 的安装 URL 里），
      # 故按官方示例放 repository variable 而非 secret。
      # repositories 显式限定：不写的话 token 会覆盖该 App 安装到的所有仓库。
      # 私钥只在这里出现，其输出由 create-github-app-token 自行 ::add-mask::。
      - if: steps.bump.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: koishi
      # HEAD:main 而非 main：runner 上未必存在名为 main 的本地分支。
      # 三点讲究：
      #   · 凭证走 env + shell 变量，不把 ${{ steps.app-token.outputs.token }}
      #     内联进 run——脚本原文进日志，内联会把 token 明文写进去。
      #   · 用完整 URL 而非 git remote，绕开 .git/config 里的 remote 配置。
      #   · core.hooksPath 指向空处以禁用 hook：构建期代码若被污染，塞一个
      #     .git/hooks/pre-push 就能在这个步骤里读到 GH_TOKEN 并外传。
      # skip-version 时不推：那次运行没有新提交可推（补发场景）。
      - if: steps.bump.outputs.changed == 'true' && !inputs.skip-version
        name: 推送版本提交
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git -c core.hooksPath=/dev/null push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
      # 里程碑正文骨架只在这次要建里程碑时才需要（`milestone` 非空），与 tag 环
      # 的里程碑分支同条件——批次 tag 不需要正文。走 notes 子命令：上一个
      # milestone/* 或历史 v* tag → HEAD 的 CHANGELOG 新增条目 + 版本表 + PR 列表。
      # 正文写 stdout、进度写 stderr，故这里直接重定向取文件。
      - if: steps.bump.outputs.changed == 'true' && steps.bump.outputs.milestone != ''
        name: 生成里程碑正文骨架
        run: bun run release notes > "$RUNNER_TEMP/release-notes.md"
      - if: steps.bump.outputs.changed == 'true' && steps.bump.outputs.milestone != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 30
      # 打包给 publish job；node_modules 与 .git 都不需要
      - if: steps.bump.outputs.changed == 'true'
        name: 打包工作区
        run: tar --exclude=./node_modules --exclude=./.git -czf "$RUNNER_TEMP/release-workspace.tgz" .
      # retention 必须长于「等人工审批」这段不可控时长：publish 卡在 environment
      # 审批上，多久有人点没人能保证。原写 retention-days: 1，2026-10-07 那次发布
      # 等到次日才获批（run 37633548554，prepare 完成到 publish 开始间隔约 25 小时），
      # 产物在审批通过前已被清理，publish 第一步 download-artifact 就以
      # `Artifact not found` 失败——版本提交已推 main 而包一个没发，只能 skip-version
      # 补发。30 天 = 仓库默认（Settings → Actions → Artifact and log retention，
      # 上限 90），足以覆盖任何正常的审批延迟。
      - if: steps.bump.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-workspace
          path: ${{ runner.temp }}/release-workspace.tgz
          retention-days: 30

  publish:
    name: publish（OIDC 发包，需 environment 审批）
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 与 npm 信任配置的 environment claim 同名；required reviewers 在这里生效。
    # 这是「合并 ≠ 上线」的唯一结构性保证——审批发生在包真正推上 npm 之前。
    # 审批前请看清本次运行的 commit 与 workflow 内容（准备 job 持 contents: write，
    # 若其构建期代码被污染，可能已向 main 推过东西）。
    #
    # 用对象形式而非 `environment: release` 简写：GitHub 两者都接受，但
    # SchemaStore 的 github-workflow.json 里，job 级 environment 是
    # `oneOf: [string, #/definitions/environment]`，而 definitions.environment
    # 是 required:["name"] 的对象——编辑器若缓存了旧版 schema（job 级直接
    # $ref 到对象定义），简写会被误报 "Value 'release' is not valid"。
    # 对象形式在新旧 schema 与 GitHub 本体下均合法。
    environment:
      name: release
    permissions:
      # tag / GitHub Release 由后面的 tag job 负责（它只持 contents: write），
      # 本 job 保持只读——持有 OIDC 的 job 不再额外获得写仓库能力
      contents: read
      id-token: write # OIDC：换包级短时 token + 自动 provenance
    steps:
      - uses: oven-sh/setup-bun@v2
      # runner 上的 npm 是系统级安装（/usr/local/lib/node_modules/npm），而
      # /usr/local 属 root：`npm install -g npm@11` 会往 /usr/local/share/man/man5
      # 写而 EACCES——现场见 run 36331787266 的 publish job（此前从未跑到这一步，
      # 是因为首次 dispatch 在 prepare 的推送就失败了）。改为装进用户级 prefix
      # 并把它的 bin 前置进 PATH：GITHUB_PATH 只对后续步骤生效，故安装与写 PATH
      # 必须在同一步；不用 sudo，也就不会在 npm 缓存里留下 root-owned 文件。
      - name: 升级 npm（OIDC 发布需 npm ≥ 11.15.0）
        run: |
          npm install -g npm@11 --prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
      # 留证据：publish 环内部同样按 PATH 找 npm（tooling/release/core/proc.ts 的
      # runNpm），这行确认后续步骤真的用上了 11
      - name: 确认 npm 版本
        run: npm --version
      - uses: actions/download-artifact@v8
        with:
          name: release-workspace
          path: ${{ runner.temp }}
      - name: 解包到工作区
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          tar -xzf "$RUNNER_TEMP/release-workspace.tgz" -C "$GITHUB_WORKSPACE"
      # 不跑 bun install：工具链只用 node: 内建模块，npm publish 也不需要 node_modules
      #
      # NPM_CONFIG_LOGLEVEL=verbose 不是调试残留，而是唯一的故障可见性来源：
      # npm 的 OIDC 换 token（npm/lib/utils/oidc.js）每个失败分支都只写
      # log.verbose，然后静默退回「无凭证发布」，registry 于是回 ENEEDAUTH——
      # 线上日志里一句原因都没有。2026-10-13 的 run 38395363229 即此：prepare
      # 全绿、隔 55 秒 publish 就死在 `npm error code ENEEDAUTH`，看不出是信任
      # 配置缺失、claims 不符还是 id_token 取不到。开 verbose 后 npm 会打印
      # `oidc Failed token exchange request with body message: …`（或
      # `Failed to fetch id_token from GitHub: …`），那才是真正的报错。
      # 不泄露凭证：换来的 token 只进请求头，npm 的 http 日志不打印请求头。
      - name: 逐包发布
        working-directory: ${{ github.workspace }}
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: bun run release publish

  tag:
    name: tag（批次 tag + 里程碑）
    needs: [prepare, publish]
    # publish 成功才打 tag：审批被拒 / 发包中断时不该留下「已发布」的记录。
    # commit 为空只发生在 changed=false（本次没有要发布的提交），此时也不该打 tag。
    if: needs.publish.result == 'success' && needs.prepare.outputs.commit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 写仓库（建 tag 与 draft Release）但不持 OIDC。本 job 不 checkout、不 install、
    # 不执行任何构建期代码——只用 gh / jq / date 与下载好的正文，攻击面限于「写 tag」。
    permissions:
      contents: write
    steps:
      # 批次 tag：每批发布一个，轻量（不造 tag 对象）、不建 Release。
      # 它只回答「npm 上这套版本对应哪棵树」，名字必须带日期与当日序号：
      # 2026-09-14～10-25 的 27 个发布提交里，单日最多 4 个。
      - name: 打批次 tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          # 日期取版本提交的 committer 时间、按 Asia/Shanghai 渲染：仓内 CHANGELOG
          # 与维护者的日历口径都是 +08，用 runner 的 UTC 会把「凌晨发布的批次」
          # 记到前一天。
          iso=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT}" --jq '.commit.committer.date')
          day=$(TZ=Asia/Shanghai date -d "$iso" +%Y.%m.%d)
          refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/release/${day}-" 2>/dev/null || echo '[]')
          if [ -z "$refs" ]; then refs='[]'; fi
          # 幂等：同一提交已有批次 tag（tag job 重跑）→ 跳过，不追加 -2
          same=$(echo "$refs" | jq -r --arg c "$COMMIT" '[.[] | select(.object.sha == $c)] | length')
          if [ "$same" -gt 0 ]; then
            echo "::warning::提交 ${COMMIT} 已有批次 tag，跳过"
            exit 0
          fi
          seq=$(echo "$refs" | jq -r '[.[] | .ref | capture("-(?<n>[0-9]+)$").n | tonumber] | (max // 0) + 1')
          tag="release/${day}-${seq}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="$COMMIT" > /dev/null
          echo "::notice::已创建批次 tag ${tag} → ${COMMIT}"
      # 里程碑才有正文：只在 prepare 判定「该兼容线还没有标记」时下载骨架。
      - if: needs.prepare.outputs.milestone != ''
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes
      # 里程碑 tag 用 annotated（与历史 v1.1.5 / v1.1.8 同形态：带 tagger 与
      # message）。指向版本提交 SHA 而非 main 的 tip：publish 可能等审批跨夜，
      # 期间 main 已前进，打 tip 会指到一棵没发布出去的树。
      - if: needs.prepare.outputs.milestone != ''
        name: 打里程碑 tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          MILESTONE: ${{ needs.prepare.outputs.milestone }}
        run: |
          tag="milestone/${MILESTONE}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > /dev/null 2>&1; then
            echo "::warning::里程碑 ${tag} 已存在，跳过创建（上一轮可能已建好）"
            exit 0
          fi
          # 两段式：先造 tag 对象（annotated），再把它挂到 refs/tags/<tag>。
          # 用默认 GITHUB_TOKEN 即可——仓库规则集只保护分支，tag 不在保护范围。
          object=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$tag" \
            -f message="Koishi-CE ${tag}（core ${MILESTONE}.x 兼容线里程碑）" \
            -f object="$COMMIT" \
            -f type=commit \
            --jq .sha)
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="$object" > /dev/null
          echo "::notice::已创建里程碑 tag ${tag} → ${COMMIT}"
      # draft 不建 tag、也不对外可见：人在这里把正文按主题改写后再点发布。
      # 发布后不可修改（immutable），所以正文的最后一道关必须是人。
      - if: needs.prepare.outputs.milestone != ''
        name: 建里程碑 draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE: ${{ needs.prepare.outputs.milestone }}
        run: |
          tag="milestone/${MILESTONE}"
          # 幂等：重跑时 Release 可能已存在，不当成失败——tag 与正文都已在上一轮落地
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::warning::Release ${tag} 已存在，跳过创建"
            exit 0
          fi
          gh release create "$tag" \
            --verify-tag \
            --draft \
            --title "Koishi-CE ${MILESTONE} 线里程碑" \
            --notes-file "$RUNNER_TEMP/release-notes/release-notes.md"
          echo "::notice::draft Release ${tag} 已创建：改写正文后发布即可"
