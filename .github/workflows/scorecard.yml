# OpenSSF Scorecard 供应链安全评分
#
# 官方 ossf/scorecard-action：对仓库跑供应链健康检查（branch protection、
# SAST、依赖更新、token 权限等一揽子项），产出 0-10 分。
# 三条产出链路：
# - publish_results: true → 结果公开发布到 scorecard.dev，README 徽章的数据源
# - upload-sarif → 以独立工具（OSSF Scorecard）出现在 Security → code scanning，
#   与 default setup 的 CodeQL 按工具名区分，互不冲突
# - artifact → SARIF 原件留档 5 天，便于排查
#
# 权限：id-token: write 是 publish 的联邦身份要求；security-events: write
# 是 SARIF 上传要求；顶层 read-all 收紧其余全部。
# 触发：每周一 UTC 4 点例行扫描 + push main + 手动 dispatch。

name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: 0 4 * * 1
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run analysis
        # 该 action 不发布 v2 漂移大 tag，只能 pin 精确版本（首跑实证：
        # @v2 直接 Unable to resolve action）
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
