name: 功能请求
description: 为本仓库提议新功能或改进
title: "Feature: "
labels:
  - enhancement
body:
  - type: dropdown
    attributes:
      label: 请求类型
      description: |
        本仓库是 [koishijs/koishi](https://github.com/koishijs/koishi) 的社区再分发仓库。
        如果上游已经实现了你想要的功能,可以直接提出同步请求,我们会按 `docs/UPSTREAM.md` 的流程移植。
      options:
        - 同步上游已有的功能
        - 对现有功能的改进
        - 全新的功能
    validations:
      required: true
  - type: textarea
    attributes:
      label: 上游相关链接
      description: 若为同步上游的功能,请提供对应的上游 PR / commit / release 链接;否则可留空。
  - type: textarea
    attributes:
      label: 要解决的问题
      description: 请简要说明是什么问题让你想要这个功能。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期望的解决方案
      description: 请说明你希望如何解决这个问题,例如新增什么功能、如何交互。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 考虑过的替代方案
      description: 除上述方案外,你还考虑过哪些实现方式?
  - type: textarea
    attributes:
      label: 补充信息
      description: 其他需要补充的上下文或截图。
