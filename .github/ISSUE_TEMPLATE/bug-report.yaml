name: Bug 报告
description: 报告本仓库中某个包或插件的问题
title: "Bug: "
labels:
  - bug
body:
  - type: input
    attributes:
      label: 受影响的包或插件
      description: |
        请填写 `@koishi-ce/*` 包名或仓库内路径,可以填写多个。
        例如:`@koishi-ce/core`、`@koishi-ce/plugin-admin`、`apps/online`。
      placeholder: "@koishi-ce/..."
    validations:
      required: true
  - type: textarea
    attributes:
      label: 问题描述
      description: 请简明扼要地描述遇到了什么问题。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 请描述如何触发这个问题,越具体越好。
      placeholder: |
        1. 启用插件 '...'
        2. 发送指令 '...'
        3. 观察到 '...'
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期望行为
      description: 请描述你期望发生的行为。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 相关日志与截图
      description: 请尽量附上 Koishi 控制台日志、聊天记录或相关截图。日志较长时请只保留关键部分,并使用代码块包裹。
  - type: textarea
    attributes:
      label: 运行环境
      description: 请填写运行环境的版本信息。
      value: |
        - 操作系统: <!-- 例如 Windows 11 / Ubuntu 24.04 -->
        - 运行时: <!-- 例如 Bun 1.2.4 / Node.js 22.12.0 -->
        - 适配器平台: <!-- 例如 OneBot、Discord、Telegram -->
        - Koishi 版本: <!-- 例如 4.18.11 -->
        - 相关包版本: <!-- 例如 @koishi-ce/plugin-admin 1.0.0 -->
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 上游是否存在同样的问题
      description: |
        本仓库是 [koishijs/koishi](https://github.com/koishijs/koishi) 的社区再分发仓库,大部分代码移植自上游。
        若该问题在上游同样存在,建议同时到上游仓库反馈,以便问题得到根治。
      options:
        - 不确定
        - 是,上游同样存在
        - 否,仅本仓库存在
  - type: textarea
    attributes:
      label: 补充信息
      description: 其他需要补充的上下文,例如相关的配置片段(注意隐去 token 等敏感信息)。
