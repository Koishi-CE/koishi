# PR 自动打标配置（actions/labeler v5，由 triage workflow 消费）。
#
# 仅覆盖「范围」与「文档」两个维度：类型 label 由 issue 模板自带，
# 状态与上游维度由维护者手动维护。glob 未命中时不出 label；
# sync-labels 关闭，只增不减，手动摘除不会被后续 push 加回。
#
# 前导 / 锚定仓库根级文件（否则会匹配到各包内的同名文件）。

"范围:控制台与前端":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/web/**"
          - "plugins/webui/**"

"范围:核心框架":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/node/**"

"范围:插件生态":
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/common/**"
          - "plugins/infra/**"

"范围:工具链与构建":
  - changed-files:
      - any-glob-to-any-file:
          - "tooling/**"
          - "apps/koishi-scripts/**"
          - "packages/shim/**"
          - ".github/**"
          - "/*.json*"
          - "/bunfig.toml"
          - "/bun.lock"
          - "/.editorconfig"

"范围:脚手架":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/koishi-create/**"

"文档":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"
