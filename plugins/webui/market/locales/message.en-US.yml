commands.plugin:
  description: Plugin management

commands.plugin.install:
  description: Install Plugins
  messages:
    expect-name: Please specify a plugin name.
    already-installed: The plugin is already installed.
    not-found: Plugin not found.
    success: Installation Successful!
commands.plugin.uninstall:
  description: Uninstall plugin
  messages:
    expect-name: Please specify a plugin name.
    not-installed: The plugin is not installed.
    success: Uninstallation Successful!
commands.plugin.upgrade:
  description: Upgrade Plugin
  options:
    self: Upgrade Koishi core
  messages:
    all-updated: All plugins are already up to date.
    available: Dependency updates are available:
    prompt: Enter "Y" to upgrade all dependencies, or "N" to cancel.
    cancelled: Operation canceled.
    success: Upgrade Successful!
