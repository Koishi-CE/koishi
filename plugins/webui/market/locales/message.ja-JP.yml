commands.plugin:
  description: プラグイン管理

commands.plugin.install:
  description: プラグインのインストール
  messages:
    expect-name: プラグイン名を入力してください。
    already-installed: このプラグインはすでにインストールされています。
    not-found: プラグインが見つかりませんでした。
    success: インストールしました！
commands.plugin.uninstall:
  description: プラグインのアンインストール
  messages:
    expect-name: プラグイン名を入力してください。
    not-installed: このプラグインはインストールされていません。
    success: アンインストールしました！
commands.plugin.upgrade:
  description: プラグインのアップグレード
  options:
    self: Koishi 本体をアップグレード
  messages:
    all-updated: すべてのプラグインは最新バージョンです。
    available: 更新可能な依存関係があります：
    prompt: 「Y」を入力するとすべての依存関係をアップグレードし、「N」を入力すると取り消します。
    cancelled: 操作を取り消しました。
    success: アップグレードしました！
