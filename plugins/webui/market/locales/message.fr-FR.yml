commands.plugin:
  description: Gestion des plugins

commands.plugin.install:
  description: Installer des plugins
  messages:
    expect-name: Veuillez saisir un nom de plugin.
    already-installed: Ce plugin est déjà installé.
    not-found: Plugin introuvable.
    success: Installation réussie !
commands.plugin.uninstall:
  description: Désinstaller un plugin
  messages:
    expect-name: Veuillez saisir un nom de plugin.
    not-installed: Ce plugin n'est pas installé.
    success: Désinstallation réussie !
commands.plugin.upgrade:
  description: Mettre à jour un plugin
  options:
    self: Mettre à jour le noyau de Koishi
  messages:
    all-updated: Tous les plugins sont déjà à jour.
    available: Mises à jour de dépendances disponibles :
    prompt: Saisissez « Y » pour mettre à jour toutes les dépendances, ou « N » pour annuler.
    cancelled: Opération annulée.
    success: Mise à jour réussie !
