registry:
  $description: Registry settings
  endpoint: The download source for plugins. Defaults to the current project's npm config.
  timeout: Timeout for fetching plugin data.

search:
  $description: Search settings
  endpoint: The URL used to search the plugin market. Defaults to the registry settings.
  timeout: Timeout for searching the plugin market.
  proxyAgent: The proxy used for searching the plugin market.
