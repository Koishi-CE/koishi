registry:
  $description: Registry-Einstellungen
  endpoint: Die Download-Quelle für Plugins. Folgt standardmäßig der npm-Konfiguration des aktuellen Projekts.
  timeout: Zeitlimit beim Abrufen von Plugin-Daten.

search:
  $description: Sucheinstellungen
  endpoint: Die URL für die Suche im Plugin-Markt. Folgt standardmäßig den Registry-Einstellungen.
  timeout: Zeitlimit für die Suche im Plugin-Markt.
  proxyAgent: Der Proxy für die Suche im Plugin-Markt.
