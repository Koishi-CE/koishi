commands.plugin:
  description: Управление плагинами

commands.plugin.install:
  description: Установка плагинов
  messages:
    expect-name: Укажите название плагина.
    already-installed: Этот плагин уже установлен.
    not-found: Плагин не найден.
    success: Успешно установлено!
commands.plugin.uninstall:
  description: Удаление плагина
  messages:
    expect-name: Укажите название плагина.
    not-installed: Этот плагин не установлен.
    success: Успешно удалено!
commands.plugin.upgrade:
  description: Обновление плагина
  options:
    self: Обновить ядро Koishi
  messages:
    all-updated: Все плагины уже последней версии.
    available: Доступны обновления зависимостей:
    prompt: Введите «Y», чтобы обновить все зависимости, или «N», чтобы отменить операцию.
    cancelled: Операция отменена.
    success: Успешно обновлено!
