commands.plugin:
  description: Plugin-Verwaltung

commands.plugin.install:
  description: Plugins installieren
  messages:
    expect-name: Bitte geben Sie einen Plugin-Namen an.
    already-installed: Dieses Plugin ist bereits installiert.
    not-found: Plugin nicht gefunden.
    success: Installation erfolgreich!
commands.plugin.uninstall:
  description: Plugin deinstallieren
  messages:
    expect-name: Bitte geben Sie einen Plugin-Namen an.
    not-installed: Dieses Plugin ist nicht installiert.
    success: Deinstallation erfolgreich!
commands.plugin.upgrade:
  description: Plugin aktualisieren
  options:
    self: Koishi selbst aktualisieren
  messages:
    all-updated: Alle Plugins sind bereits auf dem neuesten Stand.
    available: Verfügbare Abhängigkeits-Updates:
    prompt: Geben Sie "Y" ein, um alle Abhängigkeiten zu aktualisieren, oder "N", um abzubrechen.
    cancelled: Vorgang abgebrochen.
    success: Aktualisierung erfolgreich!
