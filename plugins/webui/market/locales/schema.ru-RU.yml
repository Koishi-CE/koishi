registry:
  $description: Настройки источника плагинов
  endpoint: Источник загрузки плагинов. По умолчанию используется конфигурация npm текущего проекта.
  timeout: Время ожидания при получении данных о плагинах.

search:
  $description: Настройки поиска
  endpoint: Адрес для поиска в рынке плагинов. По умолчанию используется источник плагинов.
  timeout: Время ожидания при поиске в рынке плагинов.
  proxyAgent: Прокси для поиска в рынке плагинов.
