registry:
  $description: 外掛程式來源設定
  endpoint: 外掛程式的下載來源。預設跟隨當前專案的 npm config。
  timeout: 取得外掛程式資料的逾時時間。

search:
  $description: 搜尋設定
  endpoint: 用於搜尋外掛程式市場的網址。預設跟隨外掛程式來源設定。
  timeout: 搜尋外掛程式市場的逾時時間。
  proxyAgent: 用於搜尋外掛程式市場的代理。
