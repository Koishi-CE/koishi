registry:
  $description: Paramètres de la source de plugins
  endpoint: La source de téléchargement des plugins. Par défaut, suit la configuration npm du projet actuel.
  timeout: Délai d'expiration pour la récupération des données de plugins.

search:
  $description: Paramètres de recherche
  endpoint: L'URL utilisée pour rechercher dans le marché des plugins. Par défaut, suit les paramètres de la source de plugins.
  timeout: Délai d'expiration pour la recherche dans le marché des plugins.
  proxyAgent: Le proxy utilisé pour rechercher dans le marché des plugins.
