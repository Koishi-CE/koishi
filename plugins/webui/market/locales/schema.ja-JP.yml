registry:
  $description: プラグインソースの設定
  endpoint: プラグインのダウンロードソース。デフォルトは現在のプロジェクトの npm config に従います。
  timeout: プラグインデータを取得する際のタイムアウト時間。

search:
  $description: 検索設定
  endpoint: プラグインマーケットを検索する URL。デフォルトはプラグインソースの設定に従います。
  timeout: プラグインマーケットを検索する際のタイムアウト時間。
  proxyAgent: プラグインマーケットの検索に使用するプロキシ。
