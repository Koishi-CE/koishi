root: フロントエンドページのルートディレクトリ。
uiPath: フロントエンドページを表示するパス。
apiPath: バックエンド API サービスのパス。
selfUrl: Koishi サービスが公開されているアドレス。
open: アプリケーションの起動後にブラウザでコンソールを自動的に開く。
head:
  $desc: ページのヘッダー情報をカスタマイズします。
  $inner:
    tag:
      $desc: タグ名。
      $inner:
        - title
        - link
        - meta
        - script
        - style
        - カスタム
    attrs: タグの属性。
    content: タグの内容。
heartbeat:
  interval: ハートビートの送信間隔 (ミリ秒)。
  timeout: ハートビートのタイムアウト時間 (ミリ秒)。
devMode: デバッグモードを有効にする (開発者専用)。
cacheDir: デバッグサーバーのキャッシュディレクトリ。
dev:
  allowedHosts: 開発サーバーへのアクセスを許可する追加ドメイン。空欄の場合は Vite のデフォルト（localhost と IP 直接入力のみ）が適用されます。
