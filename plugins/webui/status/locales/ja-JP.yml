commands:
  status:
    description: 実行状態を確認する
    messages:
      status:
        1: 実行中
        0: オフライン
        2: 接続中
        4: 再接続中
        3: 切断中
      bot: <p>{user.name}：<i18n path={"commands.status.messages.status." + status}/></p>
      epilog: |-
        ==========
        CPU 使用率：{ (cpu[0] * 100).toFixed() }% / { (cpu[1] * 100).toFixed() }%
        メモリ使用率：{ (memory[0] * 100).toFixed() }% / { (memory[1] * 100).toFixed() }%
