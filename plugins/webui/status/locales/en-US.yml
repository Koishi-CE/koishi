commands:
  status:
    description: Display the status
    messages:
      status:
        1: Running
        0: Offline
        2: Connecting
        4: Reconnecting
        3: Disconnecting
      bot: '<p>{user.name}: <i18n path={"commands.status.messages.status." + status}/></p>'
      epilog: |-
        ==========
        CPU usage: { (cpu[0] * 100).toFixed() }% / { (cpu[1] * 100).toFixed() }%
        Memory usage: { (memory[0] * 100).toFixed() }% / { (memory[1] * 100).toFixed() }%
