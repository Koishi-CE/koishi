base: Wurzelverzeichnis der für den Benutzer angezeigten Pfade, standardmäßig das aktuelle Arbeitsverzeichnis.
root: Liste der zu überwachenden Dateien oder Verzeichnisse, relativ zum Pfad `base`.
ignored: Zu ignorierende Dateien oder Verzeichnisse. Unterstützt die [Glob Patterns](https://github.com/micromatch/micromatch)-Syntax.
debounce: Wartezeit vor dem Auslösen von Aktualisierungen.
