base: Répertoire racine des chemins affichés pour l'utilisateur, par défaut le répertoire de travail actuel.
root: Liste des fichiers ou répertoires à surveiller, relatifs au chemin `base`.
ignored: Fichiers ou répertoires à ignorer. Prend en charge la syntaxe [Glob Patterns](https://github.com/micromatch/micromatch).
debounce: Temps d'attente avant le déclenchement des mises à jour.
