base: ユーザーに表示されるパスのルートディレクトリ。デフォルトは現在の作業ディレクトリです。
root: 監視するファイルまたはディレクトリのリスト。`base` パスからの相対パスで指定します。
ignored: 無視するファイルまたはディレクトリ。[Glob Patterns](https://github.com/micromatch/micromatch) 構文に対応しています。
debounce: 更新をトリガーするまでの待機時間。
