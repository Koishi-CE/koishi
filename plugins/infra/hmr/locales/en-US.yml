base: Root directory of user-visible paths, defaults to the current working directory.
root: List of files or directories to watch, relative to the `base` path.
ignored: Files or directories to ignore. Supports [Glob Patterns](https://github.com/micromatch/micromatch) syntax.
debounce: Waiting time before updates are triggered.
