base: Корневой каталог отображаемых пользовательских путей, по умолчанию — текущий рабочий каталог.
root: Список файлов или каталогов для отслеживания, относительно пути `base`.
ignored: Файлы или каталоги, которые следует игнорировать. Поддерживается синтаксис [Glob Patterns](https://github.com/micromatch/micromatch).
debounce: Время ожидания перед запуском обновлений.
