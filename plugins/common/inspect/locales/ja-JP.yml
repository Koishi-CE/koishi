commands:
  inspect:
    description: ユーザー、チャンネルまたはメッセージの詳細を表示
    usage: |-
      inspect @user
      inspect #channel
      inspect
    messages:
      invalid: 引数を解析できませんでした。
      user: ユーザー ID：{id}
      channel: チャンネル ID：{id}
      message: |-
        プラットフォーム名：{platform}
        メッセージ ID：{messageId}
        チャンネル ID：{channelId}
        グループ ID：{guildId}
        ユーザー ID：{userId}
        自身 ID：{selfId}
