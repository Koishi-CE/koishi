commands:
  inspect:
    description: Details zu Benutzern, Kanälen oder Nachrichten anzeigen
    usage: |-
      inspect @user
      inspect #channel
      inspect
    messages:
      invalid: Argumente konnten nicht analysiert werden.
      user: 'Benutzer-ID: {id}'
      channel: 'Kanal-ID: {id}'
      message: |-
        Plattformname: {platform}
        Nachrichten-ID: {messageId}
        Kanal-ID: {channelId}
        Gruppen-ID: {guildId}
        Benutzer-ID: {userId}
        Eigene ID: {selfId}
